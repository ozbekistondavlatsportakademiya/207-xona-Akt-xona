function sheetNumbers(values){
 if(values.some(value=>value.trim()===''||!Number.isFinite(Number(value))||Number(value)<0)) return null;
 const digits=values.map(Number), sum=digits.reduce((a,b)=>a+b,0);
 return Number.isFinite(sum)?[sum,sum/digits.length,Math.max(...digits)]:null;
}

 [['Xalqaro paralimpiya qo‘mitasi','Международный паралимпийский комитет','International Paralympic Committee'],'https://www.paralympic.org/'],
 [['Xalqaro olimpiya qo‘mitasi','Международный олимпийский комитет','International Olympic Committee'],'https://www.olympics.com/ioc'],
 [['UNESCO · Sun’iy intellekt etikasi','ЮНЕСКО · Этика искусственного интеллекта','UNESCO · Ethics of Artificial Intelligence'],'https://unesdoc.unesco.org/ark:/48223/pf0000381137'],
 [['NCSC · Onlayn xavfsizlik','NCSC · Безопасность в интернете','NCSC · Online security tips'],'https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online'],
 [['IBM · Sun’iy intellekt asoslari','IBM · Основы искусственного интеллекта','IBM · AI fundamentals'],'https://www.ibm.com/think/topics/artificial-intelligence']
];
function sources(){
 return section('sources',tr('207A auditoriyasining asosiy hujjati va rasmiy o‘quv manbalari.','Основной документ аудитории 207A и официальные учебные источники.','The Room 207A source document and official learning resources.'))+`<section class="panel"><h2>${tr('Oflayn nusxa','Офлайн-копия','Offline copy')}</h2><p class="sub">${tr('Barcha o‘quv bo‘limlari va mashqlar bitta HTML faylda.','Все разделы и упражнения собраны в одном HTML-файле.','All modules and exercises are contained in a single HTML file.')}</p><div class="actions" style="margin-top:12px">${download()}</div></section><section class="panel"><h2>${tr('Auditoriya materiallari','Материалы аудитории','Classroom material')}</h2><p>2AR.docx · ${room()} · ${name('chatbots')} / LibreOffice</p></section>
 <section class="panel"><h2>${tr('Platformalarning rasmiy saytlari','Официальные сайты платформ','Official platform websites')}</h2><ul class="source-list">${BOTS.map(([id])=>`<li>${external(id[2],id[0])}</li>`).join('')}</ul></section>
 <section class="panel"><h2>${tr('Rasmiy va birlamchi manbalar','Официальные источники и первоисточники','Official and primary sources')}</h2><ul class="source-list">${references.map(([label,url])=>`<li>${external(url,tx(label))}</li>`).join('')}${timeline.map(([year,summary,url])=>`<li>${external(url,year+' · '+tx(summary))}</li>`).join('')}</ul></section>`;
}
const pages={home,ai,chatbots:bots,libreoffice:office,'digital-sport':sport,cybersecurity:safety,quiz,sources};
function render(){
 chrome();
 $('main').innerHTML=pages[current]();
 if(current==='libreoffice')updateSheet();
 if(current==='chatbots')comparison();
 if(current==='digital-sport')updateChart();
 if(current==='quiz')renderQuiz();
}
function dialogSection(title,content){
 return `<section class="dialog-section"><h3>${title}</h3><p>${content}</p></section>`;
}
function dialogHeading(title){
 return `<div class="dialog-head"><h2 id="modal-title">${title}</h2>${button('×',`id="close-dialog" aria-label="${tr('Yopish','Закрыть','Close')}"`)}</div>`;
}
function detail(key,i){
 const purpose=tr('Asosiy vazifasi','Основное назначение','Purpose');
 const capabilities=tr('Imkoniyatlari','Возможности','Capabilities');
 const education=tr('Ta’limda','В образовании','In education');
 const sportLabel=tr('Sportda','В спорте','In sport');
 let title,content;
 if(key==='chatbots'){
   const [id,job,features,edu,spt,prompt,limits]=BOTS[i];
   title=id[0];
   content=`<p class="kicker">${id[1]}</p>`+dialogSection(purpose,tx(job))+dialogSection(capabilities,tx(features))+dialogSection(education,tx(edu))+dialogSection(sportLabel,tx(spt))+dialogSection(tr('Afzalliklari va cheklovlari','Преимущества и ограничения','Strengths and limitations'),tx(limits))+
   `<div class="prompt"><h3>${tr('Prompt namunasi','Пример промпта','Example prompt')}</h3><p id="prompt-text">${tx(prompt)}</p>${button(tr('Promptni nusxalash','Скопировать промпт','Copy prompt'),'id="copy-prompt"')}<output id="copy-status" aria-live="polite"></output></div><p class="sub">${external(id[2],tr('Rasmiy sayt','Официальный сайт','Official website'))}</p>`;
 }else if(key==='libreoffice'){
   const [id,job,features,edu,spt]=OFFICE[i];
   title=id[0];
   content=officeArt(i)+dialogSection(purpose,tx(job))+dialogSection(capabilities,tx(features))+dialogSection(tr('Fayl formatlari','Форматы файлов','File formats'),id[1])+dialogSection(education,tx(edu))+dialogSection(sportLabel,tx(spt));
 }else{
   const [name,short,body]=LESSONS[key][i];
   title=tx(name);
   content=`<p class="note">${tx(short)}</p><p>${tx(body)}</p>${key==='ai'&&i===3?neural():''}`;
 }
 $('modal').innerHTML=dialogHeading(title)+content;
}
const searchable=[
 ...Object.keys(routes).map(key=>({key,values:routes[key]})),
 ...Object.entries(LESSONS).flatMap(([key,rows])=>rows.map((row,i)=>({key,i,values:row.flat()}))),
 ...BOTS.map((row,i)=>({key:'chatbots',i,values:[row[0][0],row[0][1],...row.slice(1).flat()]})),
 ...OFFICE.map((row,i)=>({key:'libreoffice',i,values:[...row[0],...row.slice(1).flat()]}))
];
const normalize=value=>value.toLocaleLowerCase().normalize('NFKC').replace(/[’‘ʻʼ']/g,'').replace(/ё/g,'е').replace(/[–—-]/g,' ');
function match(query,values){
 return normalize(query).trim().split(/\s+/).every(word=>values.some(value=>normalize(value).includes(word)));
}
function searchDialog(){
 const prompt=tr('Mavzu yoki dastur nomi','Название темы или программы','Topic or application name');
 $('modal').innerHTML=dialogHeading(tr('Saytdan qidirish','Поиск по сайту','Search the site'))+`<label class="field">${prompt}<input autofocus type="search" id="search-input" value="${esc(search)}"></label><div class="dialog-list" id="search-results" aria-live="polite"></div>`;
 fillSearch();
}
function fillSearch(){
 const available=searchable.filter(item=>search.trim()?match(search,item.values):item.i===undefined);
 $('search-results').innerHTML=available.slice(0,25).map(({key,i,values})=>i===undefined?link(key):button(
 key==='libreoffice'||key==='chatbots'?values[0]:values[lang],`data-detail="${key}:${i}"`)).join('')||`<p>${tr('Natija topilmadi.','Ничего не найдено.','No results found.')}</p>`;
}
async function copyPrompt(){
 const value=$('prompt-text').textContent;
 try{
   await navigator.clipboard.writeText(value);
   if(!$('copy-status'))return;
   $('copy-status').textContent=tr('Nusxalandi.','Скопировано.','Copied.');
 }catch{
   if(!$('copy-status'))return;
   $('copy-status').textContent=tr('Matnni tanlab Ctrl+C tugmalarini bosing.','Выделите текст и нажмите Ctrl+C.','Select the text and press Ctrl+C.');
   const copy=document.createElement('textarea');
   copy.className='fallback-copy';
   copy.value=value;
   copy.readOnly=true;
   copy.setAttribute('aria-label',tr('Prompt matni','Текст промпта','Prompt text'));
   $('copy-status').append(copy);
   copy.select();
 }
}
window.addEventListener('hashchange',()=>{
 const next=route();
 if(next===current)return;
 current=next;
 mobileMenu=false;
 if($('modal').open)$('modal').close();
 render();
 $('main').focus({preventScroll:true});
 window.scrollTo(0,0);
});
$('skip').addEventListener('click',event=>{event.preventDefault();$('main').focus();});
document.addEventListener('click',event=>{
 const target=event.target.closest('button,a,[data-dot]');
 if(!target)return;
 const d=target.dataset;
 if(d.lang!==undefined){
   lang=Number(d.lang);
   save('language',locales[lang]);
   render();
   document.querySelector(`[data-lang="${lang}"]`).focus({preventScroll:true});
 }else if(target.id==='theme'){
   theme=theme==='dark'?'light':'dark';
   save('theme',theme);
   document.documentElement.dataset.theme=theme;
   target.innerHTML=icon(theme==='dark'?'sun':'moon');
   target.setAttribute('aria-pressed',String(theme==='dark'));
 }else if(target.id==='menu'){
   mobileMenu=!mobileMenu;
   $('nav').classList.toggle('open',mobileMenu);
   target.setAttribute('aria-expanded',String(mobileMenu));
 }else if(target.id==='search-button'){
   returnFocus=target;
   searchDialog();
   $('modal').showModal();
 }else if(d.detail){
   const [key,i]=d.detail.split(':');
   const modal=$('modal');
   if(!modal.open)returnFocus=target;
   detail(key,Number(i));
   if(modal.open)$('close-dialog').focus();
   else modal.showModal();
 }else if(target.id==='close-dialog'){
   $('modal').close();
 }else if(target.closest('#modal')&&target.matches('a[href^="#"]')){
   $('modal').close();
 }else if(target.id==='copy-prompt'){
   void copyPrompt();
 }else if(d.week!==undefined||d.dot!==undefined){
   activeWeek=Number(d.week??d.dot);
   updateChart();
 }else if(d.answer!==undefined&&chosen===null){
   chosen=Number(d.answer);
   if(chosen===QUESTIONS[quizIndex][1])score++;
   renderQuiz();
   $('feedback').focus();
 }else if(target.id==='quiz-next'){
   quizIndex++;
   chosen=null;
   renderQuiz(true);
 }else if(target.id==='restart'){
   quizIndex=score=0;
   chosen=null;
   renderQuiz(true);
 }else if(target.id==='to-top'){
   window.scrollTo(0,0);
   $('brand').focus({preventScroll:true});
 }else if(target.matches('#nav a')&&target.hash==='#'+current&&mobileMenu){
   mobileMenu=false;
   $('nav').classList.remove('open');
   $('menu').setAttribute('aria-expanded','false');
   $('main').focus();
 }
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.dataset.sheet!==undefined){
   scoreSheet[Number(target.dataset.sheet)]=target.value;
   updateSheet();
 }else if(target.id==='search-input'){
   search=target.value;
   fillSearch();
 }
});
document.addEventListener('change',event=>{
 const {dataset,checked}=event.target;
 if(dataset.compare===undefined)return;
 const index=Number(dataset.compare);
 if(checked)compareBots.add(index);else compareBots.delete(index);
 comparison();
});
$('modal').addEventListener('click',event=>{
 if(event.target!==$('modal'))return;
 const rect=$('modal').getBoundingClientRect();
 if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('modal').close();
});
$('modal').addEventListener('close',()=>{
 if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});
 returnFocus=null;
});
render();
</script>
